name: check
on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 방송·날씨 확인
        run: python check.py
      - name: 결과 저장
        run: |
          git config user.name "snow-watch-bot"
          git config user.email "snow-watch-bot@users.noreply.github.com"
          git add state.json data/state.json data/stations.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; else git commit -m "확인 결과 갱신"; git pull --rebase -q; git push; fi
