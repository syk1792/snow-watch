name: check
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 15분마다 (GitHub 예약 실행은 밀릴 수 있어서 촘촘하게 둔다)
  push:
    paths: ["cams.json", "check.py", "engine.py", ".github/workflows/check.yml"]   # 캠 목록이나 확인 코드를 고쳐 올리면 바로 한 번 돈다
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 방송·날씨 확인
        run: python check.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: 결과 저장
        run: |
          git config user.name "snow-watch-bot"
          git config user.email "snow-watch-bot@users.noreply.github.com"
          git add state.json data/state.json data/stations.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; else git commit -m "확인 결과 갱신"; git pull --rebase -q; git push; fi
